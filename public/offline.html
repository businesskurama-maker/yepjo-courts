<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0c0d" />
<title>Offline — YEPJO</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0d;color:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:112px;height:112px;border-radius:50%}
  h1{font-size:1.25rem;margin:16px 0 8px}
  p{color:#a8b0b8;max-width:34ch;margin:0 auto 20px;line-height:1.5;font-size:.95rem}
  button{font:inherit;font-weight:600;background:#c6f432;color:#0b0c0d;border:0;border-radius:999px;padding:12px 24px;min-height:44px;cursor:pointer}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <img src="/logo.webp" alt="Yepjo Pickleball and Badminton Court" />
    <h1>You're offline</h1>
    <p>Court availability, bookings and chat need a live connection. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
